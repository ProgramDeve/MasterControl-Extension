<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🔔 Master Control - Recordatorio</title>
  <link rel="icon" type="image/png" href="icono.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 400px;
      height: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .alert-container {
      text-align: center;
      padding: 25px;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      margin: 20px;
      border: 1px solid rgba(255, 215, 0, 0.5);
      animation: fadeIn 0.5s ease, pulse 1s ease infinite;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); }
      50% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.6); }
    }
    .alert-icon {
      font-size: 64px;
      margin-bottom: 15px;
      animation: ring 1s ease infinite;
    }
    @keyframes ring {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      75% { transform: rotate(-15deg); }
    }
    .alert-title {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .alert-message {
      font-size: 15px;
      color: #e2e8f0;
      margin-bottom: 20px;
      padding: 12px;
      background: rgba(0,0,0,0.4);
      border-radius: 12px;
      word-break: break-word;
      border-left: 3px solid #FFD700;
    }
    .alert-time {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .btn-ok {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #0a0a0a;
      border: none;
      padding: 10px 30px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.2s;
    }
    .btn-ok:hover { 
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }
    .sound-icon {
      position: absolute;
      bottom: 10px;
      right: 15px;
      font-size: 12px;
      color: #FFD700;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="alert-container">
    <div class="alert-icon">🔔</div>
    <div class="alert-title">MASTER CONTROL</div>
    <div class="alert-message" id="alertMessage">Cargando...</div>
    <div class="alert-time" id="alertTime"></div>
    <button class="btn-ok" id="btnOk">ENTENDIDO</button>
    <div class="sound-icon">🔊</div>
  </div>
  <script src="alert.js"></script>
</body>
</html>
